[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autorate-portal"
version = "0.1.0"
description = "Evidence packets for certified automation rates; the portal tier computes no statistic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6,<3",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
autorate-portal = "autorate_portal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autorate_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
