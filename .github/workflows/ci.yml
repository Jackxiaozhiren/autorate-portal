name: portal-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite / plants / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install (frozen)
        run: uv sync --frozen --extra dev
      - name: Portal suite
        run: uv run --frozen --extra dev pytest -q
      - name: M4 acceptance criteria, each from its own command
        run: |
          set -euo pipefail
          uv run --frozen --extra dev pytest -o addopts= -q \
            tests/test_claims.py::test_ac5_a_share_above_the_certified_autorate_refutes_with_both_numbers_and_units
          echo "M4_AC5_RC=0"
          uv run --frozen --extra dev pytest -o addopts= -q \
            tests/test_claims_audit.py::test_ac6_a_field_the_packet_never_measured_is_cannot_be_bounded_with_comparability
          echo "M4_AC6_RC=0"
          uv run --frozen --extra dev pytest -o addopts= -q \
            tests/test_exports.py::test_ac7_a_source_that_no_longer_rederives_blocks_the_export
          echo "M4_AC7_RC=0"
          uv run --frozen --extra dev pytest -o addopts= -q \
            tests/test_trend.py::test_ac8_two_freezes_do_not_share_an_axis_without_a_boundary
          echo "M4_AC8_RC=0"
          uv run --frozen --extra dev pytest -o addopts= -q \
            tests/test_policies.py::test_ac11_a_superseded_packet_is_stale_in_the_sdk_payload
          echo "M4_AC11_RC=0"
      - name: Negative-control plants (all red, all restored)
        run: uv run --frozen --extra dev python tools/plants.py
      - name: Lint
        run: uv run --frozen --extra dev ruff check src tests tools --select=E9,F63,F7,F82,F401,F811 --line-length=120
      - name: Byte-compile
        run: uv run --frozen python -m compileall -q src tools
      - name: YAML / TOML parse
        run: |
          uv run --frozen --with pyyaml python -c "
          import pathlib, yaml
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(p.read_text()); print('ok', p)
          "
          python -c "import tomllib,pathlib; tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('pyproject ok')"

  packet:
    name: frozen packet / AC1 / AC9 / AC10 / I6
    runs-on: ubuntu-latest
    needs: suite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev

      - name: Clean checkout of the pinned frozen revision
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.2 https://github.com/Jackxiaozhiren/autorate.git "$RUNNER_TEMP/frozen"
          git clone --depth 1 --branch v0.1.2 https://github.com/Jackxiaozhiren/autorate.git "$RUNNER_TEMP/frozen-rebuild"
          REV=$(git -C "$RUNNER_TEMP/frozen" rev-parse HEAD)
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "pinned revision: $REV"
          test "$REV" = e9b0cf179175ab59da506115c54101eaf8f44389

      - name: Build full and shareable packets
        run: |
          set -euo pipefail
          mkdir -p packets
          COMMON=(--source "$RUNNER_TEMP/frozen" --revision "$REV" --version 0.1.2
                  --wheel autorate-0.1.2-py3-none-any.whl
                  --wheel-sha256 7709d3faa560417efcbd8066f6db79d741d995bbbb9b23d2d595ed2a6fb38205
                  --expected-rederived "612 /612")
          uv run --frozen autorate-portal packet build --out packets/frozen-full.packet.tar "${COMMON[@]}"
          uv run --frozen autorate-portal packet build --out packets/frozen-shareable.packet.tar --shareable "${COMMON[@]}"

      - name: Reproducibility from a second clean checkout
        run: |
          set -euo pipefail
          uv run --frozen autorate-portal packet build --out packets/rebuild.packet.tar \
            --source "$RUNNER_TEMP/frozen-rebuild" --revision "$REV" --version 0.1.2 \
            --wheel autorate-0.1.2-py3-none-any.whl \
            --wheel-sha256 7709d3faa560417efcbd8066f6db79d741d995bbbb9b23d2d595ed2a6fb38205 \
            --expected-rederived "612 /612"
          cmp packets/frozen-full.packet.tar packets/rebuild.packet.tar
          echo "byte-identical: yes"

      - name: AC1 / AC14 verify and HTML
        run: |
          set -euo pipefail
          uv run --frozen autorate-portal packet verify packets/frozen-full.packet.tar --registry packets/registry.json
          uv run --frozen autorate-portal packet verify packets/frozen-full.packet.tar --registry packets/registry.json
          uv run --frozen autorate-portal packet html packets/frozen-full.packet.tar -o packets/frozen-full.html
          uv run --frozen autorate-portal packet html packets/frozen-shareable.packet.tar -o packets/frozen-shareable.html

      - name: Section 11 localization - F2 in both languages as CI artifacts
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json, pathlib
          from types import SimpleNamespace
          from autorate_portal import db, i18n
          from autorate_portal.ingest import summary_fields
          from autorate_portal.packet import verify_bundle
          from autorate_portal.views import f2_locale_artifact

          i18n.assert_complete()
          v = verify_bundle(pathlib.Path('packets/frozen-full.packet.tar'))
          assert v.ok and v.manifest is not None, 'the frozen bundle must verify first'
          manifest = v.manifest
          name = 'data/cert_jev.json'
          raw = v.files[name]
          document = json.loads(raw.decode('utf-8'), parse_float=str)
          summary = db.CertificateSummary(**summary_fields(manifest, name, raw))
          packet = SimpleNamespace(id=manifest.packet_id,
                                   protocol_digest=manifest.protocol_digest,
                                   manifest_sha256=manifest.manifest_sha256)
          pages = {}
          for locale in i18n.LANGUAGES:
              target = pathlib.Path('packets') / ('f2-%s.html' % locale)
              text = f2_locale_artifact(summary=summary, packet=packet,
                                        rubric=manifest.rubric, certificate=document,
                                        locale=locale)
              target.write_text(text, encoding='utf-8')
              pages[locale] = text
              print('F2 %s: %d bytes' % (locale, len(text.encode('utf-8'))))
          assert pages['en'] != pages['zh-Hans']
          assert 'lang="en"' in pages['en'] and 'lang="zh-Hans"' in pages['zh-Hans']
          for locale, text in pages.items():
              assert 'empty_feasible_set' in text, locale
              assert '<div class="card">' not in text, 'a refusal renders as a refusal'
          assert '拒绝' in pages['zh-Hans'] and 'refusal' in pages['en'], \
              'the state differs in text as well as hue'
          print('localization: one catalog, two languages, verbatim refusal reason')
          PY

      - name: Section 8.4 privacy audit
        run: |
          uv run --frozen python - <<'PY'
          import json, pathlib, tarfile
          files = tarfile.open('packets/frozen-shareable.packet.tar').getnames()
          assert not [n for n in files if n.endswith('.jsonl')], files
          manifest = json.loads(tarfile.open('packets/frozen-shareable.packet.tar').extractfile('manifest.json').read())
          assert manifest['records_excluded'] is True and len(manifest['excluded_records']) == 6
          for name in ('frozen-full.html', 'frozen-shareable.html'):
              html = pathlib.Path('packets', name).read_bytes()
              assert b'"case_id"' not in html, name
          print('shareable packet: 0 records files, 0 records rows in HTML')
          PY

      - name: AC9 real replay in a clean container
        run: |
          set -euo pipefail
          docker pull python:3.13-slim
          uv run --frozen autorate-portal verify-packet packets/frozen-full.packet.tar \
            --backend container --image python:3.13-slim

      - name: AC9 real replay via isolated uv environment
        run: |
          set -euo pipefail
          uv run --frozen autorate-portal verify-packet packets/frozen-full.packet.tar --backend uv

      - name: AC10 shareable packet is a named not-run
        run: |
          set -euo pipefail
          set +e
          uv run --frozen autorate-portal verify-packet packets/frozen-shareable.packet.tar --backend uv
          RC=$?
          set -e
          echo "SHAREABLE_REPLAY_RC=$RC"
          test "$RC" -eq 3

      - name: M2 doctor before a replay is spent
        run: |
          set -euo pipefail
          uv run --frozen autorate-portal doctor --backend container --packet packets/frozen-full.packet.tar

      - name: M2 AC4 - a stored denominator that disagrees is a mismatch, not a pass
        run: |
          set -euo pipefail
          uv run --frozen autorate-portal packet build --out packets/ac4-wrong-denominator.tar \
            --source "$RUNNER_TEMP/frozen" --revision "$REV" --version 0.1.2 \
            --wheel autorate-0.1.2-py3-none-any.whl \
            --wheel-sha256 7709d3faa560417efcbd8066f6db79d741d995bbbb9b23d2d595ed2a6fb38205 \
            --expected-rederived "611 /612"
          set +e
          uv run --frozen autorate-portal run packets/ac4-wrong-denominator.tar \
            --backend container --runs packets/runs.jsonl
          RC=$?
          set -e
          echo "AC4_MISMATCH_RC=$RC"
          test "$RC" -eq 4
          uv run --frozen autorate-portal runs list --runs packets/runs.jsonl
          uv run --frozen python - <<'PY'
          import json
          rows = [json.loads(line) for line in open('packets/runs.jsonl') if line.strip()]
          row = rows[-1]
          assert row['state'] == 'mismatch', row
          assert row['digest_stored'] and row['digest_replayed']
          assert row['digest_stored'] != row['digest_replayed']
          assert row['digest_stored'] in row['reason'] and row['digest_replayed'] in row['reason']
          assert row['denominator_stored'] == '611 /612'
          assert row['denominator_replayed'] == '612 /612'
          assert row['command'] == ['verify', '--protocol', 'protocol.json']
          assert row['argv'] and row['argv'][0] == 'docker'
          assert row['exit_code'] == 0
          print('AC4 mismatch row: both digests named, pinned invocation and exit code recorded')
          PY

      - name: M2 AC9 through the engine - run rows are what a stranger reads
        run: |
          set -euo pipefail
          uv run --frozen autorate-portal run packets/frozen-full.packet.tar \
            --backend container --runs packets/runs.jsonl
          uv run --frozen autorate-portal run packets/frozen-full.packet.tar \
            --backend container --runs packets/runs.jsonl
          uv run --frozen python - <<'PY'
          import json
          rows = [json.loads(line) for line in open('packets/runs.jsonl') if line.strip()]
          certified = [r for r in rows if r['state'] == 'certified']
          assert len(certified) == 2, 'two attempts, two rows: %s' % rows
          assert certified[0]['run_id'] != certified[1]['run_id']
          for row in certified:
              assert row['denominator_replayed'] == '612 /612'
              assert row['command'] == ['verify', '--protocol', 'protocol.json']
              assert row['argv'] and row['argv'][0] == 'docker'
              assert row['exit_code'] == 0
              assert len(row['stdout_sha256']) == 64
          print('run store: 2 attempts, 2 rows, both certified at 612 /612')
          PY

      - name: I6 plant - swapped wheel hash must go red, then restore
        run: |
          set -euo pipefail
          uv run --frozen --extra dev python tools/i6_plant.py packets/frozen-full.packet.tar --backend uv

      - name: Upload packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-packet-evidence
          path: packets/
          if-no-files-found: error
          include-hidden-files: true

  parity:
    name: parity 6.3 / committed artefacts render byte-equal
    runs-on: ubuntu-latest
    needs: suite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev

      - name: Clone the pinned frozen revision
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.2 https://github.com/Jackxiaozhiren/autorate.git "$RUNNER_TEMP/frozen"
          REV=$(git -C "$RUNNER_TEMP/frozen" rev-parse HEAD)
          echo "pinned revision: $REV"
          test "$REV" = e9b0cf179175ab59da506115c54101eaf8f44389

      - name: Section 6.3 parity against the committed artefacts
        run: uv run --frozen --extra dev python tools/parity.py --frozen "$RUNNER_TEMP/frozen"
